parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_mysql'
        server_version: '8.0'
        charset: UTF8

        url: '%env(resolve:DATABASE_URL)%'
    orm:
        mappings:
            # Maps the test-application entities (the Product override that adds the plugin's
            # non-returnable flag). Attribute-mapped, so no XML/YAML mapping files are needed.
            TestApplication:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/Entity'
                prefix: 'Tests\Madcoders\SyliusRmaPlugin\Application\Entity'
                alias: TestApplication
