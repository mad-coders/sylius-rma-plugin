imports:
    - { resource: "@SyliusCoreBundle/Resources/config/app/config.yml" }
    - { resource: "@SyliusPayumBundle/Resources/config/app/config.yaml" }
    - { resource: "@SyliusAdminBundle/Resources/config/app/config.yml" }
    - { resource: "@SyliusShopBundle/Resources/config/app/config.yml" }
    - { resource: "@SyliusApiBundle/Resources/config/app/config.yaml" }

    - { resource: '@MadcodersSyliusRmaPlugin/Resources/config/config.yml' }

parameters:
    sylius_core.public_dir: '%kernel.project_dir%/public'

sylius_shop:
    product_grid:
        include_all_descendants: true

sylius_api:
    enabled: true

# Override the Sylius Product model with the test-application Product that carries the plugin's
# per-product "non-returnable" flag, so the feature can be exercised end to end.
sylius_product:
    resources:
        product:
            classes:
                model: Tests\Madcoders\SyliusRmaPlugin\Application\Entity\Product
