# NOTE (Sylius 2 upgrade, phase 2): the Sylius 1 `sylius_ui.events` block that used to live
# here (product non-returnable checkbox, shop footer return link, and the admin/shop order-return
# and configuration content events, including the `_legacySonataEvent` bridges) has been removed.
# The `sylius_ui.events` / template-event system does not exist in Sylius 2; its replacement is
# sylius/twig-hooks, wired in phase 6 (admin) and phase 7 (shop). See the hook mapping table in
# docs/upgrade-sylius-2/ROADMAP.md.

# order return state machine
#
# Migrated from winzou/state-machine to symfony/workflow behind the Sylius state-machine
# abstraction (docs/upgrade-sylius-2/ROADMAP.md phase 4, ADR 0013). The callbacks that winzou ran
# on transitions (changelog updates and withdrawal notifiers) are re-wired as Symfony Workflow
# `completed` event listeners in Workflow\OrderReturnWorkflowSubscriber. The graph name, places
# and transitions are unchanged from the winzou definition so OrderReturnInterface::GRAPH and the
# `_sylius.state_machine` routes keep working.
framework:
  workflows:
    return_status:
      type: state_machine
      marking_store:
        type: method
        property: orderReturnStatus
      supports:
        - Madcoders\SyliusRmaPlugin\Entity\OrderReturnInterface
      initial_marking: draft
      places:
        - draft
        - new
        - completed
        - canceled
        - withdrawal_request
        - withdrawn
      transitions:
        new:
          from: [draft]
          to: new
        complete:
          from: [new]
          to: completed
        cancel:
          from: [draft, new]
          to: canceled
        request_withdrawal:
          from: [draft]
          to: withdrawal_request
        # withdraw FROM draft = instant/fast-forward withdrawal (customer-initiated).
        withdraw:
          from: [draft]
          to: withdrawn
        # withdraw FROM withdrawal_request = admin-approved withdrawal. symfony/workflow allows two
        # transitions to share the name `withdraw`; the completed-event listener (phase 4)
        # distinguishes them by the transition's from-place, preserving the winzou from-scoped
        # callbacks.
        withdraw_from_request:
          name: withdraw
          from: [withdrawal_request]
          to: withdrawn
        fallback_to_return:
          from: [withdrawal_request]
          to: new

# HOW TO USE ORDER RETURN STATE MACHINE (Sylius 2)
#
#  if ($this->stateMachine->can($orderReturn, OrderReturnInterface::GRAPH, OrderReturnInterface::TRANSITION_COMPLETE)) {
#      $this->stateMachine->apply($orderReturn, OrderReturnInterface::GRAPH, OrderReturnInterface::TRANSITION_COMPLETE);
#      $this->orderReturnRepository->add($orderReturn);
#  }
#
# where $this->stateMachine is Sylius\Abstraction\StateMachine\StateMachineInterface (injected in
# place of the old SM\Factory\FactoryInterface; consumer migration is part of phase 4).
