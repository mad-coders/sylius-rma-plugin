# order return state machine

winzou_state_machine:
  order_return:
    class: 'Madcoders\SyliusRmaPlugin\Entity\OrderReturn'
    graph: return_status
    property_path: orderReturnStatus
    state_machine_class: "%sylius.state_machine.class%"
    states:
      draft: ~
      new: ~
      completed: ~
      canceled: ~
      withdrawal_request: ~
      withdrawn: ~
    callbacks:
      after:
        updated_changelog_on_cancel:
          on: [ 'cancel' ]
          do: [ '@madcoders.sylius_rma_plugin.services.callbacks.updated_changelog_on_cancel', 'updatedChangelogOnCancel' ]
          args: [ 'object' ]
        updated_changelog_on_complete:
          on: [ 'complete' ]
          do: [ '@madcoders.sylius_rma_plugin.services.callbacks.updated_changelog_on_complete', 'UpdatedChangelogOnComplete' ]
          args: [ 'object' ]
        withdrawal_request_notifier:
          on: [ 'request_withdrawal' ]
          do: [ '@madcoders.sylius_rma_plugin.services.callbacks.withdrawal_request_notifier', 'onRequestWithdrawal' ]
          args: [ 'object' ]
        # withdraw FROM draft = instant/fast-forward withdrawal (customer-initiated)
        withdrawal_instant_notifier:
          on: [ 'withdraw' ]
          from: [ 'draft' ]
          do: [ '@madcoders.sylius_rma_plugin.services.callbacks.withdrawal_completed_notifier', 'onWithdraw' ]
          args: [ 'object' ]
        # withdraw FROM withdrawal_request = admin-approved withdrawal (admin-initiated)
        withdrawal_approved_notifier:
          on: [ 'withdraw' ]
          from: [ 'withdrawal_request' ]
          do: [ '@madcoders.sylius_rma_plugin.services.callbacks.withdrawal_resolution_notifier', 'onConfirmWithdrawal' ]
          args: [ 'object' ]
        withdrawal_resolution_fallback:
          on: [ 'fallback_to_return' ]
          do: [ '@madcoders.sylius_rma_plugin.services.callbacks.withdrawal_resolution_notifier', 'onFallbackToReturn' ]
          args: [ 'object' ]

    transitions:
      new:
        from: ['draft']
        to: new
      complete:
        from: ['new']
        to: completed
      cancel:
        from: ['draft', 'new']
        to: canceled
      request_withdrawal:
        from: ['draft']
        to: withdrawal_request
      withdraw:
        from: ['draft', 'withdrawal_request']
        to: withdrawn
      fallback_to_return:
        from: ['withdrawal_request']
        to: new

