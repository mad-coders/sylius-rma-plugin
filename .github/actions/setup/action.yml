name: "Set up PHP and dependencies"
description: "Installs PHP with the plugin's extensions and resolves Composer dependencies against a given Sylius line."

# Shared by every CI job so that the Sylius version under test is decided in exactly one place.
# The plugin ships no composer.lock (library convention), so each job resolves dependencies with
# `composer update` after pinning `sylius/sylius` to the requested minor line.
#
# `dependencies: lowest` adds `--prefer-lowest --prefer-stable`, which resolves the *floor* of every
# constraint in composer.json instead of the ceiling. Without it CI only ever exercises the newest
# releases, so a constraint that is too loose (or missing entirely) stays green here while breaking
# consumers who sit on older versions.

inputs:
    php-version:
        description: "PHP version passed to shivammathur/setup-php"
        required: true
    sylius-version:
        description: "Sylius minor line to resolve against, e.g. 1.12"
        required: true
    dependencies:
        description: "Dependency resolution preference: 'highest' (default) or 'lowest'"
        required: false
        default: "highest"
    composer-options:
        description: "Extra flags for the composer update call, e.g. --no-scripts"
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: "${{ inputs.php-version }}"
              extensions: intl, pdo_mysql, zip, gd
              tools: composer:v2
              coverage: none

        - name: Pin Sylius to the ${{ inputs.sylius-version }} line
          shell: bash
          run: composer require --no-update --no-scripts --no-interaction "sylius/sylius:${{ inputs.sylius-version }}.*"

        - name: Get Composer cache directory
          id: composer-cache
          shell: bash
          run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

        - name: Cache Composer dependencies
          uses: actions/cache@v4
          with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: composer-${{ inputs.php-version }}-sylius-${{ inputs.sylius-version }}-${{ inputs.dependencies }}-${{ hashFiles('composer.json') }}
              restore-keys: composer-${{ inputs.php-version }}-sylius-${{ inputs.sylius-version }}-${{ inputs.dependencies }}-

        - name: Install dependencies
          shell: bash
          env:
              DEPENDENCIES: "${{ inputs.dependencies }}"
              COMPOSER_OPTIONS: "${{ inputs.composer-options }}"
          run: |
              PREFER=""
              if [ "$DEPENDENCIES" = "lowest" ]; then
                  PREFER="--prefer-lowest --prefer-stable"
              fi
              composer update --no-interaction --no-progress --prefer-dist $PREFER $COMPOSER_OPTIONS

        - name: Show the resolved versions of the constrained packages
          shell: bash
          run: composer show --direct
