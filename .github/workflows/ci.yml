name: CI

# Continuous integration for the Sylius RMA plugin (2.0 line, Sylius ^2.2).
# Mirrors the local quality gates (see Makefile / ai/coding-rules.md) on GitHub-hosted
# runners: static analysis + code style, unit tests, fixtures, and the non-JavaScript Behat
# suite. All four jobs run ungated as of phase 8 of docs/upgrade-sylius-2/ROADMAP.md.
#
# The per-job setup (PHP, Composer cache, install) lives in the reusable composite action
# .github/actions/setup, shared with the 1.x lines. Those lines pass a `sylius-version` to
# narrow the root constraint per matrix leg; this branch supports a single Sylius major, so
# it omits the input and resolves `^2.2` as-is.
#
# Decision recorded in docs/adr-log/0010-github-actions-ci.md.

on:
    push:
        branches: ["1.0", "1.1", "1.2", "1.3", "2.0", "master", "main"]
    pull_request: ~
    workflow_dispatch: ~

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PHP_VERSION: "8.2"
    NODE_VERSION: "20"

jobs:
    static:
        name: Static analysis & code style
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Validate composer.json
              run: composer validate --no-check-lock

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  composer-options: "--no-scripts"

            - name: PHPStan
              run: make phpstan

            - name: Rector (dry-run)
              run: make rector

            - name: ECS
              run: make ecs

    unit:
        name: Unit tests (PHPUnit)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  composer-options: "--no-scripts"

            - name: PHPUnit
              run: make phpunit

    fixtures:
        name: Fixtures runnable (sylius:fixtures:load)
        runs-on: ubuntu-latest
        services:
            # Same MySQL service as the Behat job (see docker-compose.yml): the test app's
            # DATABASE_URL and the make targets work unchanged.
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: rma
                ports:
                    - "3307:3306"
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -prma"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"

            - name: Create the test database
              run: make backend-test

            - name: Load the default fixtures suite
              run: make fixtures-test

    behat:
        name: Behat (non-JavaScript)
        runs-on: ubuntu-latest
        services:
            # Mirrors docker-compose.yml: MySQL 8 on host port 3307 with root password "rma",
            # so the test app's DATABASE_URL (tests/Application/.env) and the make targets work
            # unchanged.
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: rma
                ports:
                    - "3307:3306"
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -prma"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "${{ env.NODE_VERSION }}"

            - name: Build test application assets
              run: make frontend

            - name: Create the test database
              run: make backend-test

            - name: Run Behat (non-JavaScript)
              run: make behat

            - name: Upload Behat logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: behat-logs
                  path: etc/build/
                  if-no-files-found: ignore
