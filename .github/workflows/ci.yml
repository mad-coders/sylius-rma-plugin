name: CI

# Continuous integration for the Sylius RMA plugin.
# Mirrors the local quality gates (see Makefile / ai/coding-rules.md) on GitHub-hosted
# runners: static analysis + code style, unit tests, and the non-JavaScript Behat suite.
# Every job runs once per supported Sylius line (see the `sylius` matrix below), because the
# plugin supports `>=1.12,<1.14` and the two lines differ (generic repository interfaces,
# the state-machine abstraction bundle).
# The plugin ships no composer.lock, so every job resolves dependencies fresh. By default that
# means the HIGHEST available versions; the `unit` job additionally runs a `lowest` leg
# (`composer update --prefer-lowest --prefer-stable`) so a constraint that is too loose fails here
# rather than at a consumer sitting on older dependencies.
# Decision recorded in docs/adr-log/0010-github-actions-ci.md.

on:
    push:
        branches: ["1.0", "1.1", "master", "main"]
    pull_request: ~
    workflow_dispatch: ~

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PHP_VERSION: "8.2"
    NODE_VERSION: "20"

jobs:
    static:
        name: Static analysis & code style (Sylius ${{ matrix.sylius }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # No `lowest` leg here: at their floors the analysis tools themselves break on PHP
                # 8.2 (symplify/easy-coding-standard from 2021 emits fatal-level deprecations, and
                # babdev/pagerfanta-bundle is incompatible with the resolved symfony/http-kernel).
                # Those are third-party dev-tool floors that say nothing about the plugin's own
                # constraints, so the floor is exercised by the `unit` job instead.
                sylius: ["1.12", "1.13"]
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  sylius-version: "${{ matrix.sylius }}"
                  composer-options: "--no-scripts"

            - name: PHPStan
              run: make phpstan

            - name: Rector (dry-run)
              run: make rector

            - name: ECS
              run: make ecs

    unit:
        name: Unit tests (PHPUnit, Sylius ${{ matrix.sylius }}, ${{ matrix.dependencies }} deps)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                sylius: ["1.12", "1.13"]
                # `lowest` resolves the floor of every constraint in composer.json rather than the
                # ceiling, so a missing or too-loose constraint fails here instead of at a consumer.
                # Only the unit job carries this dimension: it is the cheapest suite and needs no
                # database or built assets, so it is the natural place to catch dependency-floor
                # regressions. `static`, `fixtures` and `behat` stay on `highest` only.
                dependencies: ["highest", "lowest"]
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  sylius-version: "${{ matrix.sylius }}"
                  dependencies: "${{ matrix.dependencies }}"
                  composer-options: "--no-scripts"

            - name: PHPUnit
              run: make phpunit

    fixtures:
        name: Fixtures runnable (sylius:fixtures:load, Sylius ${{ matrix.sylius }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                sylius: ["1.12", "1.13"]
        services:
            # Same MySQL service as the Behat job (see docker-compose.yml): the test app's
            # DATABASE_URL and the make targets work unchanged.
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: rma
                ports:
                    - "3307:3306"
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -prma"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  sylius-version: "${{ matrix.sylius }}"

            - name: Create the test database
              run: make backend-test

            - name: Load the default fixtures suite
              run: make fixtures-test

    behat:
        name: Behat (non-JavaScript, Sylius ${{ matrix.sylius }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                sylius: ["1.12", "1.13"]
        services:
            # Mirrors docker-compose.yml: MySQL 8 on host port 3307 with root password "rma",
            # so the test app's DATABASE_URL (tests/Application/.env) and the make targets work
            # unchanged.
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: rma
                ports:
                    - "3307:3306"
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -prma"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  sylius-version: "${{ matrix.sylius }}"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "${{ env.NODE_VERSION }}"

            - name: Build test application assets
              run: make frontend

            - name: Create the test database
              run: make backend-test

            - name: Run Behat (non-JavaScript)
              run: make behat

            - name: Upload Behat logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: behat-logs-sylius-${{ matrix.sylius }}
                  path: etc/build/
                  if-no-files-found: ignore
