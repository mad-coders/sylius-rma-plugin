name: CI

# Continuous integration for the Sylius RMA plugin.
# Mirrors the local quality gates (see Makefile / ai/coding-rules.md) on GitHub-hosted
# runners: static analysis + code style, unit tests, and the non-JavaScript Behat suite.
# Decision recorded in docs/adr-log/0010-github-actions-ci.md.

on:
    push:
        branches: ["1.0", "1.1", "master", "main"]
    pull_request: ~
    workflow_dispatch: ~

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PHP_VERSION: "8.2"
    NODE_VERSION: "20"

jobs:
    static:
        name: Static analysis & code style
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  extensions: intl, pdo_mysql, zip, gd
                  tools: composer:v2
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

            - name: PHPStan
              run: make phpstan

            - name: ECS
              run: make ecs

    unit:
        name: Unit tests (PHPUnit)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  extensions: intl, pdo_mysql, zip, gd
                  tools: composer:v2
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

            - name: PHPUnit
              run: make phpunit

    behat:
        name: Behat (non-JavaScript)
        runs-on: ubuntu-latest
        services:
            # Mirrors docker-compose.yml: MySQL 8 on host port 3307 with root password "rma",
            # so the test app's DATABASE_URL (tests/Application/.env) and the make targets work
            # unchanged.
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: rma
                ports:
                    - "3307:3306"
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -prma"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ env.PHP_VERSION }}"
                  extensions: intl, pdo_mysql, zip, gd
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "${{ env.NODE_VERSION }}"

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer update --no-interaction --no-progress --prefer-dist

            - name: Build test application assets
              run: make frontend

            - name: Create the test database
              run: make backend-test

            - name: Run Behat (non-JavaScript)
              run: make behat

            - name: Upload Behat logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: behat-logs
                  path: etc/build/
                  if-no-files-found: ignore
